[tools]
node = "22"
bun = "latest"

[tasks.install]
description = "Install all dependencies"
env = { NODE_ENV = "development" }
run = """
cd packages/matrix-relay && bun install
cd ../../packages/supervisor && npm ci
"""

[tasks.build]
description = "Build supervisor for production"
depends = ["install"]
run = "cd packages/supervisor && npx tsc"

[tasks.dev]
description = "Start supervisor in dev mode"
depends = ["register-relay"]
run = "cd packages/supervisor && npx tsx src/index.ts"

[tasks.test]
description = "Run all tests"
run = "cd packages/supervisor && npm test"

[tasks.typecheck]
description = "Type-check all packages"
run = "cd packages/supervisor && npx tsc --noEmit"

[tasks.clean]
description = "Remove build artifacts and node_modules"
run = """
rm -rf packages/supervisor/dist packages/supervisor/node_modules
rm -rf packages/matrix-relay/node_modules
"""

[tasks.start]
description = "Run production build"
depends = ["build"]
run = "cd packages/supervisor && node dist/index.js"

[tasks.register-relay]
description = "Register matrix-relay as user-scoped MCP server"
run = "scripts/register-relay.sh"

[tasks.setup]
description = "Full setup: install deps, build, register relay, prepare .env"
depends = ["build"]
run = """
mise run register-relay
mkdir -p packages/supervisor/data
if [ ! -f .env ]; then
  cp .env.example .env
  echo "[WARN] .env created from .env.example — edit it with your Matrix credentials"
else
  echo "[INFO] .env already exists"
fi
# Generate secrets locally. Never commit .env or the hook token.
node - <<'NODE'
const fs = require('node:fs')
const crypto = require('node:crypto')
let content = fs.readFileSync('.env', 'utf8')
const replacement = crypto.randomBytes(32).toString('hex')
if (/^CMB_RELAY_SECRET=/m.test(content)) {
  content = content.replace(/^CMB_RELAY_SECRET=.*$/m, line =>
    /^[a-f0-9]{64}$/i.test(line.slice(17)) ? line : 'CMB_RELAY_SECRET=' + replacement)
} else {
  content += '\\nCMB_RELAY_SECRET=' + replacement + '\\n'
}
if (!/^MATRIX_ENABLE_E2EE=/m.test(content)) content += '\\nMATRIX_ENABLE_E2EE=true\\n'
fs.writeFileSync('.env', content, { mode: 0o600 })
NODE
chmod 600 .env
TOKEN_DIR="$HOME/.config/claude-matrix-bridge"
mkdir -p "$TOKEN_DIR"
chmod 700 "$TOKEN_DIR"
if [ ! -f "$TOKEN_DIR/handoff-token" ]; then
  node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))" > "$TOKEN_DIR/handoff-token"
fi
chmod 600 "$TOKEN_DIR/handoff-token"
echo ""
echo "Setup complete!"
"""

[tasks.deploy]
description = "Build and restart systemd service"
depends = ["build"]
run = "sudo systemctl restart claude-matrix-bridge"
